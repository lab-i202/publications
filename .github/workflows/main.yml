
name: Monitor authors and deploy encrypted Pages

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Report period: current, all, range, or a year'
        type: string
        required: true
        default: 'current'
      fresh:
        description: 'Force fresh retrieval of every external source'
        type: boolean
        default: false
      reset_state:
        description: 'Discard previous encrypted state (also resets change history)'
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * *' # Every day at 06:17 UTC. Scheduled times can be delayed.

permissions:
  contents: read

concurrency:
  group: publications-pages
  cancel-in-progress: false

jobs:
  collect:
    name: Collect authors (macOS)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install -r requirements.txt
      - name: Validate encryption secret
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
        run: |
          python - <<'PY'
          import os
          if len(os.environ.get('PUBGROUP_PASSPHRASE', '')) < 16:
              raise SystemExit('Repository secret PUBGROUP_PASSPHRASE must contain at least 16 characters.')
          print('Encryption secret is configured.')
          PY
      - uses: actions/cache/restore@v4
        if: ${{ inputs.reset_state != true }}
        with:
          path: .ci-private/state.enc.json
          key: pubgroup-macos-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pubgroup-macos-v1-${{ github.ref_name }}-
      - name: Restore previous encrypted collection
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
        run: python -m pubgroup.ci_state restore
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Poll all configured CiênciaVitae authors
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          REPORT_PERIOD: ${{ inputs.period || 'current' }}
          FORCE_FRESH: ${{ github.event_name == 'schedule' || inputs.fresh == true }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          command = ['python', '-m', 'pubgroup', 'run', '--period', os.environ['REPORT_PERIOD'], '--no-pdf', '--encrypt']
          if os.environ['FORCE_FRESH'] == 'true':
              command.append('--refresh')
          subprocess.run(command, check=True)
          PY
      - name: Encrypt collection state
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
        run: python -m pubgroup.ci_state save
      - uses: actions/cache/save@v4
        with:
          path: .ci-private/state.enc.json
          key: pubgroup-macos-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Transfer encrypted state only
        uses: actions/upload-artifact@v4
        with:
          name: publication-encrypted-state
          path: .ci-private/state.enc.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build encrypted website and PDF (Ubuntu)
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: publication-encrypted-state
          path: .ci-private
      - name: Restore authenticated publication data
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
        run: |
          test -s .ci-private/state.enc.json
          python -m pubgroup.ci_state restore
      - name: Install PDF compiler and required report font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-texgyre
          font_path="$(kpsewhich texgyreheros-regular.otf || true)"
          if [ -z "$font_path" ]; then
            echo '::error::Missing TeX Gyre Heros OpenType font required by pubgroup/report.py'
            exit 1
          fi
          echo "Report font found: $font_path"
      - name: Generate PDF and encrypted browser bundle (no recollection)
        env:
          PUBGROUP_PASSPHRASE: ${{ secrets.PUBGROUP_PASSPHRASE }}
          REPORT_PERIOD: ${{ inputs.period || 'current' }}
        run: python -m pubgroup report --period "$REPORT_PERIOD" --encrypt
      - name: Diagnose PDF compilation failure (safe for public logs)
        if: ${{ failure() }}
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          import re

          logfile = Path('output/pdf/build-error.log')
          if not logfile.is_file():
              print('No LaTeX build log found. Check the earlier failed step.')
              raise SystemExit(0)

          content = logfile.read_text(encoding='utf-8', errors='replace')
          checks = (
              ('Missing or inaccessible font', r'fontspec.*error|font.*(?:cannot be found|not found)'),
              ('Missing LaTeX package or file', r'LaTeX Error: File .*not found'),
              ('Undefined LaTeX command', r'Undefined control sequence'),
              ('Unbalanced LaTeX syntax', r'Missing \$ inserted|Missing \} inserted|Extra \}|Runaway argument'),
              ('Unsupported Unicode character', r'Unicode character .*not set up'),
              ('LaTeX fatal error', r'Emergency stop|Fatal error occurred'),
          )
          matched = False
          for title, pattern in checks:
              if re.search(pattern, content, flags=re.IGNORECASE | re.DOTALL):
                  print('LaTeX diagnostic category: ' + title)
                  matched = True
          if not matched:
              print('LaTeX failed, but no known error category matched.')
          print('The raw LaTeX log is intentionally not printed because this repository is public and the log may contain decrypted publication data.')
          PYLOG
      - name: Construct strict deployment allowlist
        env:
          REFRESH_API_URL: ${{ vars.PUBGROUP_REFRESH_API_URL }}
        run: python scripts/prepare_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish encrypted website
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
